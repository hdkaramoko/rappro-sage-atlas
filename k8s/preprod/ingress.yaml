apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: rappro-sage-atlas-preprod
  namespace: user-hdkaramoko

spec:
  ingressClassName: nginx

  rules:
    - host: rappro-sage-atlas-preprod.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rappro-sage-atlas-preprod
                port:
                  number: 80