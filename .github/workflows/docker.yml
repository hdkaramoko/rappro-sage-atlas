name: Build Docker image

on:
  push:
    branches:
      - main
      - dev
      - preprod

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "IMAGE_TAG=prod-${GITHUB_SHA}" >> $GITHUB_ENV
          elif [ "${GITHUB_REF_NAME}" = "preprod" ]; then
            echo "IMAGE_TAG=preprod-${GITHUB_SHA}" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "IMAGE_TAG=dev-${GITHUB_SHA}" >> $GITHUB_ENV
          else
            echo "Branche non prise en charge"
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rappro-sage-atlas:${{ env.IMAGE_TAG }}