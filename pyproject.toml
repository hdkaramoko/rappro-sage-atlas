[project]
name = "atlas-sage-reconciliation"
version = "0.1.0"
description = "Chargement des extractions Atlas et Sage X3"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reconciliation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
