[project]
name = "suivi-reconciliation"
version = "0.1.0"
description = "Suivi des rapprochements comptables Atlas / Sage X3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "rapidfuzz>=3.14.6",
    "django>=6.1.1",
    "python-dotenv>=1.2.4",
    "gunicorn>=26.2.0",
    "whitenoise>=6.12.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = ["coverage>=7.10,<8", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["accounts", "projects", "reconciliation", "imports_app", "dashboard"]
