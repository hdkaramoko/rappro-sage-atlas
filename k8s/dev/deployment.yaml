apiVersion: apps/v1
kind: Deployment
metadata:
  name: rappro-sage-atlas-dev
  namespace: user-hdkaramoko

spec:
  replicas: 1

  selector:
    matchLabels:
      app: rappro-sage-atlas-dev

  template:
    metadata:
      labels:
        app: rappro-sage-atlas-dev

    spec:
      imagePullSecrets:
        - name: ghcr-secret
        
      containers:
        - name: rappro-sage-atlas-dev
          image: ghcr.io/hdkaramoko/rappro-sage-atlas:dev-<sha>
          imagePullPolicy: Always

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          ports:
            - containerPort: 8000

          env:
            - name: DJANGO_DEBUG
              value: "False"

            - name: DJANGO_ALLOWED_HOSTS
              value: "rappro-sage-atlas-dev.lab.sspcloud.fr"

            # PostgreSQL
            - name: DB_ENGINE
              value: "postgresql"

            - name: DB_HOST
              value: "postgresql-cnpg-555845-rw"

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgresql-cnpg-555845-app
                  key: dbname

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-cnpg-555845-app
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-cnpg-555845-app
                  key: password