apiVersion: apps/v1
kind: Deployment
metadata:
  name: rappro-sage-atlas
  namespace: user-hdkaramoko

spec:
  replicas: 1
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: rappro-sage-atlas

  template:
    metadata:
      labels:
        app: rappro-sage-atlas

    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: matching-imports
          persistentVolumeClaim:
            claimName: rappro-imports-prod
      initContainers:
        - name: prepare-import-directory
          image: ghcr.io/hdkaramoko/rappro-sage-atlas:prod-<sha>
          command: ["/app/.venv/bin/python", "-c", "from pathlib import Path; Path('/var/lib/rappro/imports/tmp').mkdir(parents=True, exist_ok=True)"]
          volumeMounts:
            - name: matching-imports
              mountPath: /var/lib/rappro/imports
      imagePullSecrets:
        - name: ghcr-secret
        
      containers:
        - name: rappro-sage-atlas
          image: ghcr.io/hdkaramoko/rappro-sage-atlas:prod-<sha>
          imagePullPolicy: Always
          command: ["/app/.venv/bin/gunicorn", "--chdir", "/app/app-suivi-reconciliation", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--timeout", "600"]
          volumeMounts:
            - name: matching-imports
              mountPath: /var/lib/rappro/imports

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          ports:
            - containerPort: 8000

          env: &matching-environment
            - name: MATCHING_JOB_ROOT
              value: /var/lib/rappro/imports
            - name: FILE_UPLOAD_TEMP_DIR
              value: /var/lib/rappro/imports/tmp
            - name: MATCHING_JOB_RUNNER
              value: supervised
            - name: DJANGO_ENV
              value: prod
            - name: MATCHING_IMPORT_BATCH_SIZE
              value: "500"
            - name: MATCHING_MAX_ATTEMPTS
              value: "3"
            - name: MATCHING_RETENTION_DAYS
              value: "30"
            - name: DJANGO_DEBUG
              value: "False"

            - name: DJANGO_ALLOWED_HOSTS
              value: "rappro-sage-atlas.lab.sspcloud.fr"

            - name: CSRF_TRUSTED_ORIGINS
              value: "https://rappro-sage-atlas.lab.sspcloud.fr"

            # PostgreSQL
            - name: POSTGRESQL_ADDON_HOST
              value: "postgresql-cnpg-140796-rw"

            - name: POSTGRESQL_ADDON_PORT
              value: "5432"

            - name: POSTGRESQL_ADDON_DB
              valueFrom:
                secretKeyRef:
                  name: postgresql-cnpg-140796-app
                  key: dbname

            - name: POSTGRESQL_ADDON_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-cnpg-140796-app
                  key: username

            - name: POSTGRESQL_ADDON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-cnpg-140796-app
                  key: password

        # Sidecar supervisé : même pod et même PVC RWO que Gunicorn.
        - name: matching-worker
          image: ghcr.io/hdkaramoko/rappro-sage-atlas:prod-<sha>
          imagePullPolicy: Always
          command: ["/app/.venv/bin/python", "/app/app-suivi-reconciliation/manage.py", "matching_worker"]
          env: *matching-environment
          volumeMounts:
            - name: matching-imports
              mountPath: /var/lib/rappro/imports
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
